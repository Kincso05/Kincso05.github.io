<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vega-Lite Visualization</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #fafafa; }
    #vis { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; max-width: 800px; margin: 0 auto; text-align: center; }
    #vis .vega-embed { margin: 0 auto; }
    h1 { text-align: center; color: #333; font-weight: 500; }
  </style>
</head>
<body>
  <h1>Vega-Lite Visualization</h1>
  <div id="vis"></div>

  <script>
    fetch('chart.json')
      .then(response => response.json())
      .then(spec => vegaEmbed('#vis', spec, { 
        actions: { editor: true, source: true, compiled: false },
        style: { margin: '0 auto' }
      }))
      .catch(console.error);
  </script>
</body>
</html>
